{# 完全掌握勾选区：给结果页用（quiz_result / test_result）
   期望上下文变量：
     - review_items: list of {word_id, english, meaning, [is_correct]}
#}
{% if review_items %}
<div class="promote-section" style="margin-top:var(--space-8); padding:20px; background:var(--clr-bg-card, #f8f9fa); border-radius:12px;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div style="font-size:16px; font-weight:600;">本次单词</div>
    <div style="font-size:12px; color:var(--clr-text-muted);">
      勾选彻底掌握的词，加入「完全掌握」后不再进入测试
    </div>
  </div>

  <div class="promote-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">
    {% for it in review_items %}
    <label class="promote-item"
           style="display:flex; align-items:center; gap:12px; padding:10px 12px; background:white; border:1px solid var(--clr-border, #e5e7eb); border-radius:8px; cursor:pointer;">
      <input type="checkbox" class="promote-checkbox" value="{{ it.word_id }}"
             style="width:18px; height:18px; cursor:pointer;">
      <div style="flex:1; min-width:0;">
        <div style="font-size:15px; font-weight:500; color:var(--clr-text-primary);">
          {{ it.english }}
          {% if it.is_correct is defined %}
            {% if it.is_correct %}
              <span style="font-size:12px; color:var(--clr-green, #22c55e); margin-left:6px;">✓</span>
            {% else %}
              <span style="font-size:12px; color:var(--clr-red, #ef4444); margin-left:6px;">✗</span>
            {% endif %}
          {% endif %}
        </div>
        {% if it.meaning %}
        <div style="font-size:13px; color:var(--clr-text-secondary); margin-top:2px;">
          {{ it.meaning }}
        </div>
        {% endif %}
      </div>
    </label>
    {% endfor %}
  </div>

  <div style="text-align:center;">
    <button type="button" id="promoteBtn" class="btn btn--primary"
            data-count="0" disabled
            style="min-width:200px;">
      加入完全掌握 (0)
    </button>
    <div id="promoteFeedback" style="margin-top:12px; font-size:14px; color:var(--clr-green, #22c55e); min-height:20px;"></div>
  </div>
</div>

<script>
(function() {
  const boxes = document.querySelectorAll('.promote-checkbox');
  const btn = document.getElementById('promoteBtn');
  const feedback = document.getElementById('promoteFeedback');

  function updateBtn() {
    const checked = Array.from(boxes).filter(b => b.checked);
    btn.dataset.count = checked.length;
    btn.textContent = `加入完全掌握 (${checked.length})`;
    btn.disabled = checked.length === 0;
  }

  boxes.forEach(b => b.addEventListener('change', updateBtn));

  btn.addEventListener('click', async function() {
    const wordIds = Array.from(boxes).filter(b => b.checked).map(b => parseInt(b.value, 10));
    if (wordIds.length === 0) return;

    btn.disabled = true;
    btn.textContent = '提交中...';

    try {
      const resp = await fetch('/mastery/promote', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({word_ids: wordIds})
      });
      const data = await resp.json();
      if (data.ok) {
        feedback.textContent = `✓ 已加入 ${data.promoted} 个词到「完全掌握」`;
        btn.textContent = `已加入 ${data.promoted} 个 ✓`;
        // 禁用所有 checkbox，防止重复提交
        boxes.forEach(b => { b.disabled = true; });
      } else {
        feedback.style.color = 'var(--clr-red, #ef4444)';
        feedback.textContent = '✗ 提交失败：' + (data.error || '未知错误');
        btn.disabled = false;
        updateBtn();
      }
    } catch (e) {
      feedback.style.color = 'var(--clr-red, #ef4444)';
      feedback.textContent = '✗ 网络错误，请重试';
      btn.disabled = false;
      updateBtn();
    }
  });
})();
</script>
{% endif %}
